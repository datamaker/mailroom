name: Release

# v1.2.3 형태의 태그를 푸시하면:
#   1. Docker Hub 에 이미지 push (latest + 버전 태그)
#   2. npm 에 CLI 스테이징 — Trusted Publishing(OIDC), 토큰 없음.
#      공개되려면 npmjs.com 에서 사람이 승인해야 한다.
#   3. GitHub Release 생성
#
# 필요한 저장소 시크릿: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        id: version
        # v1.2.3 → 1.2.3 (이미지 태그는 v 없이 — secret-vault 와 같은 형식)
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            datamaker/mailroom:latest
            datamaker/mailroom:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm Trusted Publishing — 토큰 대신 OIDC 로 신원을 증명한다.
      # npmjs.com 의 패키지 설정에서 이 저장소와 워크플로 파일명(release.yml)을
      # 신뢰 대상으로 등록해 둬야 동작한다. provenance 는 자동으로 붙는다.
      # Allowed actions 는 스테이징만 켜 둔다(직접 publish 는 끔).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # 스테이징은 npm 11.15.0+, Node 22.14+ 가 필요하다. node 24 가 11.19 를
      # 달고 오지만 러너 이미지에 끌려다니지 않게 못박는다.
      - run: npm i -g npm@^11.15.0
      - run: npm ci
      - name: Build CLI
        run: npm run build -w @datasee/mailroom-cli
      # 바로 공개하지 않고 스테이징까지만 한다. 사람이 npmjs.com 의
      # Staged Packages 에서 승인해야(2FA) 실제로 배포된다 — 워크플로가 털려도
      # 레지스트리로 곧장 나가지 못한다.
      - name: Stage npm publish
        working-directory: cli
        run: |
          npm --version
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view @datasee/mailroom-cli version 2>/dev/null || echo none)
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "@datasee/mailroom-cli@$LOCAL 는 이미 올라가 있습니다 — 건너뜁니다."
          else
            npm stage publish --access public
            echo "::notice::@datasee/mailroom-cli@$LOCAL 를 스테이징했습니다. npmjs.com 에서 승인해야 공개됩니다."
          fi

  release:
    runs-on: ubuntu-latest
    needs: [docker, npm]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
