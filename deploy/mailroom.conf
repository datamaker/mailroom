# 관리 UI — VPN 전용 (11.0.1.21 로 오는 443)
# gatehouse 레포의 deploy/ 를 conf.d 로 마운트하는 nginx 에 얹는 형태와 같다.
server {
    listen 443 ssl;
    http2 on;
    server_name mailroom.datasee.co.kr;

    ssl_certificate     /etc/letsencrypt/live/mailroom.datasee.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mailroom.datasee.co.kr/privkey.pem;

    # 뉴스레터 본문(인라인 이미지 포함)이 커질 수 있다.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:9200;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
